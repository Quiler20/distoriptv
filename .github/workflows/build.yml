- name: Parchar Android
        run: |
          cd "$PROJ"

          # Forzar compileSdk y targetSdk directamente en build.gradle.kts
          cat > android/app/build.gradle.kts << 'EOL'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.distortionlabs.distortion_labs_iptv"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }

              defaultConfig {
                  applicationId = "com.distortionlabs.distortion_labs_iptv"
                  minSdk = 23
                  targetSdk = 36
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOL

          echo "=== build.gradle.kts forzado ==="
          cat android/app/build.gradle.kts
          echo "================================"

          # Parchear AndroidManifest
          python3 << 'EOF'
          from pathlib import Path
          m = Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          if "xmlns:tools" not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in s:
              perms = "".join(
                  f'    <uses-permission android:name="android.permission.{p}"/>\n'
                  for p in ["INTERNET", "WAKE_LOCK", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PLAYBACK", "POST_NOTIFICATIONS"]
              )
              s = s.replace("<application", perms + "    <application", 1)
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if "AudioService" not in s:
              block = '''
              <service android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true" tools:ignore="Instantiatable">
                  <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true" tools:ignore="Instantiatable">
                  <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
              </receiver>
          </application>'''
              s = s.replace("</application>", block, 1)
          m.write_text(s)
          print("AndroidManifest parcheado")
          EOF

          # Parchear MainActivity
          python3 << 'EOF'
          import re
          from pathlib import Path
          for f in Path("android/app/src/main").rglob("MainActivity.*"):
              if f.suffix == ".kt":
                  content = f.read_text()
                  pkg = re.search(r"package\s+([\w.]+)", content).group(1)
                  f.write_text(f"package {pkg}\n\nimport com.ryanheise.audioservice.AudioServiceActivity\n\nclass MainActivity : AudioServiceActivity()\n")
                  print(f"MainActivity parcheado: {f}")
          print("Listo")
          EOF
