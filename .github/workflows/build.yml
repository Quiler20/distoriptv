- name: Parchar Android
        run: |
          cd "$PROJ"
          python3 - <<'EOF'
          import re, pathlib
          root = pathlib.Path('android/app')

          # === build.gradle o build.gradle.kts ===
          for name in ('build.gradle', 'build.gradle.kts'):
              f = root / name
              if not f.exists():
                  continue
              s = f.read_text()

              # minSdk
              s = re.sub(r'minSdk(Version)?(\s*=\s*|\s+)flutter\.minSdkVersion', 'minSdk = 23', s)
              s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 23', s)

              # compileSdk → 36
              s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdk = 36', s)

              # targetSdk → 36
              s = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', s)
              s = re.sub(r'targetSdkVersion\s+\d+', 'targetSdk = 36', s)

              f.write_text(s)
              print(f'Actualizado {name}')

          # === AndroidManifest.xml ===
          m = root / 'src/main/AndroidManifest.xml'
          s = m.read_text()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              perms = ''.join(
                  '    <uses-permission android:name="android.permission.%s"/>\n' % p
                  for p in ['INTERNET', 'WAKE_LOCK', 'FOREGROUND_SERVICE',
                            'FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'POST_NOTIFICATIONS'])
              s = s.replace('<application', perms + '    <application', 1)
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'AudioService' not in s:
              block = '''
              <service android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true" tools:ignore="Instantiatable">
                  <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true" tools:ignore="Instantiatable">
                  <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
              </receiver>
          </application>'''
              s = s.replace('</application>', block, 1)
          m.write_text(s)

          # === MainActivity → AudioServiceActivity ===
          for f in (root / 'src/main').rglob('MainActivity.*'):
              if f.suffix == '.kt':
                  pkg = re.search(r'package\s+([\w.]+)', f.read_text()).group(1)
                  f.write_text(
                      'package %s\n\nimport com.ryanheise.audioservice.AudioServiceActivity\n\nclass MainActivity : AudioServiceActivity()\n' % pkg)
                  print(f'MainActivity parcheado: {f}')
          print('Android parcheado OK')
          EOF
