name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descomprimir proyecto
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Usando $ZIP"
          unzip -q "$ZIP" -d extracted
          PUB=$(find extracted -name pubspec.yaml -print -quit)
          echo "PROJ=$(dirname "$PUB")" >> $GITHUB_ENV

      - name: Generar Android y restaurar mi código
        run: |
          cd "$PROJ"
          mkdir -p /tmp/bak
          cp -r lib /tmp/bak/lib
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          flutter create --org com.distortionlabs --project-name distortion_labs_iptv --platforms=android .
          rm -rf lib
          cp -r /tmp/bak/lib lib
          cp /tmp/bak/pubspec.yaml pubspec.yaml
          ls lib
          grep -q "DISTORTION LABS" lib/main.dart

      - name: Parchar Android
        run: |
          cd "$PROJ"
          python3 << 'EOF'
          import re, pathlib
          root = pathlib.Path("android/app")

          for name in ("build.gradle", "build.gradle.kts"):
              f = root / name
              if not f.exists():
                  continue
              s = f.read_text()

              s = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", s)
              s = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 23", s)

              s = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", s)
              s = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", s)

              s = re.sub(r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36", s)
              s = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 36", s)

              f.write_text(s)
              print(f"=== {name} después del parche ===")
              print(s)
              print("=================================")

          m = root / "src/main/AndroidManifest.xml"
          s = m.read_text()
          if "xmlns:tools" not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in s:
              perms = "".join(
                  f'    <uses-permission android:name="android.permission.{p}"/>\n'
                  for p in ["INTERNET", "WAKE_LOCK", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PLAYBACK", "POST_NOTIFICATIONS"]
              )
              s = s.replace("<application", perms + "    <application", 1)
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if "AudioService" not in s:
              block = '''
              <service android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true" tools:ignore="Instantiatable">
                  <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true" tools:ignore="Instantiatable">
                  <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
              </receiver>
          </application>'''
              s = s.replace("</application>", block, 1)
          m.write_text(s)

          for f in (root / "src/main").rglob("MainActivity.*"):
              if f.suffix == ".kt":
                  content = f.read_text()
                  pkg = re.search(r"package\s+([\w.]+)", content).group(1)
                  f.write_text(f"package {pkg}\n\nimport com.ryanheise.audioservice.AudioServiceActivity\n\nclass MainActivity : AudioServiceActivity()\n")
                  print(f"MainActivity parcheado: {f}")
          print("Android parcheado OK")
          EOF

      - name: Compilar APK
        run: |
          cd "$PROJ"
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: distortion-labs-iptv-apk
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
